<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OluwaConvert Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f5faf8;
      color: #09251d;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border: 1px solid #e3ece8;
      border-radius: 20px;
      box-shadow: 0 14px 40px #09251d12;
    }

    .brand {
      margin-bottom: 8px;
      font-size: 26px;
      font-weight: 900;
      color: #087f5b;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      color: #64756f;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 7px;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e3ece8;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      color: #b42318;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">OluwaConvert</div>
    <h1>Admin Login</h1>
    <p>Authorized administrators only.</p>

    <form id="loginForm">
      <label for="password">Admin Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter admin password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/api/admin-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: password.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed");
        }

        sessionStorage.setItem("adminToken", data.token);

        window.location.href = "/admin-dashboard.html";

      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
