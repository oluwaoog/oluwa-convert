<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OluwaConvert Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f5faf8;
      color: #09251d;
    }

    header {
      background: white;
      border-bottom: 1px solid #e3ece8;
      padding: 16px 20px;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      color: #087f5b;
    }

    .logout {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      background: #09251d;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64756f;
      margin-top: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 25px 0;
    }

    .card {
      background: white;
      border: 1px solid #e3ece8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px #09251d0d;
    }

    .stat-title {
      font-size: 13px;
      color: #64756f;
      font-weight: 700;
    }

    .stat-value {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      font-weight: 900;
      color: #087f5b;
    }

    .table-card {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #e3ece8;
      font-size: 13px;
    }

    th {
      background: #f6faf8;
      font-weight: 900;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff4cc;
      font-size: 11px;
      font-weight: 900;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #64756f;
    }
    .search-box {
  margin: 15px 0 20px;
}

.search-box input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d6e3de;
  border-radius: 9px;
  font-size: 14px;
  outline: none;
}

.search-box input:focus {
  border-color: #087f5b;
  box-shadow: 0 0 0 3px #087f5b1a;
}
 .table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.refresh-btn {
  border: 0;
  border-radius: 8px;
  padding: 9px 14px;
  background: #087f5b;
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.refresh-btn:hover {
  opacity: 0.9;
}   
    .action-btn {
  border: 0;
  border-radius: 7px;
  padding: 7px 10px;
  margin: 2px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.verify {
  background: #dff5ed;
  color: #087f5b;
}

.reject {
  background: #ffe4e1;
  color: #b42318;
}

.paid {
  background: #e7f0ff;
  color: #185abc;
}
    .details {
  background: #f1f3f5;
  color: #09251d;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(9, 37, 29, 0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
}

.close-modal {
  border: 0;
  background: #f1f3f5;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid #e3ece8;
}

.detail-label {
  color: #64756f;
  font-weight: 700;
}

.detail-value {
  font-weight: 800;
  text-align: right;
  word-break: break-word;
}

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">OluwaConvert Admin</div>

    <button class="logout" onclick="logout()">
      Log Out
    </button>
  </div>
</header>

<main>

  <h1>Dashboard</h1>

  <p class="subtitle">
    Manage OluwaConvert transactions.
  </p>

  <div class="stats">

    <div class="card">
      <span class="stat-title">Total Transactions</span>
      <strong class="stat-value" id="totalTransactions">0</strong>
    </div>

    <div class="card">
      <span class="stat-title">Pending</span>
      <strong class="stat-value" id="pendingTransactions">0</strong>
    </div>

    <div class="card">
      <span class="stat-title">Total Payout</span>
      <strong class="stat-value" id="totalPayout">₦0.00</strong>
    </div>

  </div>

  <div class="card table-card">

  <div class="table-header">
  <h2>Recent Transactions</h2>

  <button class="refresh-btn" onclick="loadTransactions()">
    ↻ Refresh
  </button>
</div>
    
<div class="search-box">
  <input
    type="text"
    id="transactionSearch"
    placeholder="Search by reference, phone, network or bank..."
    oninput="filterTransactions()"
  >

  <select id="statusFilter" onchange="filterTransactions()">
    <option value="">All Statuses</option>
    <option value="PENDING">Pending</option>
    <option value="VERIFIED">Verified</option>
    <option value="PAID">Paid</option>
    <option value="REJECTED">Rejected</option>
  </select>
</div>
    <table>

      <thead>
        <tr>
          <th>Reference</th>
          <th>Type</th>
          <th>Network</th>
          <th>Amount</th>
          <th>Payout</th>
          <th>Bank</th>
          <th>Account</th>
         <th>Status</th>
<th>Action</th>
        </tr>
      </thead>

      <tbody id="transactionsBody">

        <tr>
        <td colspan="9" class="empty">
            Loading transactions...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</main>

<div class="modal" id="transactionModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Transaction Details</h2>

      <button class="close-modal" onclick="closeTransactionDetails()">
        ×
      </button>
    </div>

    <div id="transactionDetails"></div>

  </div>
</div>

<script>

  async function checkAdminSession() {
  try {
    const response = await fetch("/api/admin-transactions");

    if (response.status === 401) {
      window.location.href = "/admin.html";
      return false;
    }

    return response.ok;
  } catch (error) {
    window.location.href = "/admin.html";
    return false;
  }
}
 async function logout() {
  await fetch("/api/admin-logout", {
    method: "POST",
    credentials: "include"
  });

  window.location.href = "/admin.html";
}
  async function loadTransactions() {

    const body = document.getElementById("transactionsBody");

    try {

     const response = await fetch("/api/admin-transactions", {
  credentials: "include"
});

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Unable to load transactions");
      }

      const transactions = data.transactions || [];

      document.getElementById("totalTransactions").textContent =
        transactions.length;

      document.getElementById("pendingTransactions").textContent =
        transactions.filter(t => t.status === "PENDING").length;

      const totalPayout = transactions.reduce(
        (sum, t) => sum + Number(t.payout || 0),
        0
      );

      document.getElementById("totalPayout").textContent =
        "₦" + totalPayout.toLocaleString("en-NG", {
          minimumFractionDigits: 2
        });

      if (!transactions.length) {

        body.innerHTML = `
          <tr>
  <td colspan="9" class="empty">
  No transactions found.
</td>
          </tr>
        `;

        return;
      }

      body.innerHTML = transactions.map(t => `

        <tr>

          <td>${escapeHtml(t.reference)}</td>

          <td>${escapeHtml(t.type)}</td>

          <td>${escapeHtml(t.network)}</td>

          <td>₦${Number(t.amount).toLocaleString("en-NG", {
            minimumFractionDigits: 2
          })}</td>

          <td>₦${Number(t.payout).toLocaleString("en-NG", {
            minimumFractionDigits: 2
          })}</td>

          <td>${escapeHtml(t.bank)}</td>

          <td>****${escapeHtml(t.account_last4)}</td>

       <td>
  <span class="status">
    ${escapeHtml(t.status)}
  </span>
</td>

<td>
  <button
    class="action-btn details"
    onclick='showTransactionDetails(${JSON.stringify(t)})'>
    View Details
  </button>

  ${t.status === "PENDING" ? `
    <button class="action-btn verify"
      onclick="updateTransaction('${escapeHtml(t.reference)}', 'VERIFIED')">
      Verify
    </button>

    <button class="action-btn reject"
      onclick="updateTransaction('${escapeHtml(t.reference)}', 'REJECTED')">
      Reject
    </button>
  ` : ""}

  ${t.status === "VERIFIED" ? `
    <button class="action-btn paid"
      onclick="updateTransaction('${escapeHtml(t.reference)}', 'PAID')">
      Mark Paid
    </button>
  ` : ""}
</td>
      `).join("");

    } catch (error) {

      body.innerHTML = `
        <tr>
        <td colspan="9" class="empty">
  ${escapeHtml(error.message)}
</td>
        </tr>
      `;

    }
  }

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }
 function filterTransactions() {
  const search = document
    .getElementById("transactionSearch")
    .value
    .toLowerCase()
    .trim();

  const status = document
    .getElementById("statusFilter")
    .value
    .toLowerCase();

  const rows = document.querySelectorAll("#transactionsBody tr");

  rows.forEach(row => {
    const text = row.textContent.toLowerCase();

    const matchesSearch = text.includes(search);
    const matchesStatus =
      !status || text.includes(status);

    row.style.display =
      matchesSearch && matchesStatus ? "" : "none";
  });
}
 function showTransactionDetails(t) {
  const details = document.getElementById("transactionDetails");

  details.innerHTML = `
    <div class="detail-row">
      <span class="detail-label">Reference</span>
      <span class="detail-value">${escapeHtml(t.reference)}</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Type</span>
      <span class="detail-value">${escapeHtml(t.type)}</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Network</span>
      <span class="detail-value">${escapeHtml(t.network)}</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Amount</span>
      <span class="detail-value">
        ₦${Number(t.amount || 0).toLocaleString("en-NG", {
          minimumFractionDigits: 2
        })}
      </span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Payout</span>
      <span class="detail-value">
        ₦${Number(t.payout || 0).toLocaleString("en-NG", {
          minimumFractionDigits: 2
        })}
      </span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Bank</span>
      <span class="detail-value">${escapeHtml(t.bank)}</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Account</span>
      <span class="detail-value">****${escapeHtml(t.account_last4)}</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Status</span>
      <span class="detail-value">${escapeHtml(t.status)}</span>
    </div>
  `;

  document.getElementById("transactionModal").style.display = "flex";
}

function closeTransactionDetails() {
  document.getElementById("transactionModal").style.display = "none";
}
  async function updateTransaction(reference, status) {
  const action =
    status === "VERIFIED"
      ? "verify"
      : status === "REJECTED"
        ? "reject"
        : "mark this transaction as paid";

  if (!confirm(`Are you sure you want to ${action}?`)) {
    return;
  }

  try {
    const response = await fetch("/api/admin-update-transaction", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        reference,
        status
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to update transaction");
    }

    alert(`Transaction updated to ${status}.`);

    await loadTransactions();

  } catch (error) {
    alert(error.message);
  }
}

checkAdminSession().then((authenticated) => {
  if (authenticated) {
    loadTransactions();
  }
});
</script>

</body>
</html>
